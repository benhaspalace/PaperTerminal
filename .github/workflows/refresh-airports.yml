name: Refresh airport database

# Regenerates extensions/paperterminal/data/airports.txt from the
# public-domain OurAirports dataset and commits it if it changed.
# Trigger manually from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate airports.txt
        run: python3 build/update-airports.py

      - name: Sanity-check the result
        run: |
          LINES=$(grep -c '|' extensions/paperterminal/data/airports.txt)
          echo "$LINES airports"
          test "$LINES" -gt 2000   # refuse a suspiciously small dataset
          grep -q '^ZRH|' extensions/paperterminal/data/airports.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/paperterminal/data/airports.txt
          if git diff --cached --quiet; then
            echo "Airport database unchanged - nothing to commit."
          else
            git commit -m "Refresh airport database from OurAirports"
            git push
          fi
