name: Release

# Publishes the ready-to-copy extension zip as a GitHub Release.
#
# Triggers:
#   - every push to main (e.g. a merged pull request): if no release
#     exists yet for the version in config.xml, one is created
#     automatically, tag included. Merging a version bump is all it
#     takes to cut a release.
#   - pushing a tag like v4.0.0 manually.
#   - manual run from the Actions tab (tag input optional; defaults to
#     the version in config.xml). Re-running for an existing release
#     refreshes its assets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional; default v<config.xml version>)"
        required: false
        default: ""

permissions:
  contents: write

# Never run two releases at once (e.g. two quick merges): queue them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version, tag, and whether to publish
        id: meta
        run: |
          XMLVER="$(grep -o '<version>[^<]*' extensions/paperterminal/config.xml | cut -d'>' -f2)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$XMLVER"
          fi
          VERSION="${TAG#v}"
          if [ "$XMLVER" != "$VERSION" ]; then
            echo "Tag $TAG does not match config.xml version $XMLVER" >&2
            exit 1
          fi
          PROCEED=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" != "tag" ]; then
              # Routine merge without a version bump - nothing to do.
              echo "Release $TAG already exists; bump the version in" \
                   "config.xml (and bin/common.sh) to cut a new release."
              PROCEED=false
            fi
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "proceed=$PROCEED"
          } >> "$GITHUB_OUTPUT"

      - name: Check the extension is sane
        if: steps.meta.outputs.proceed == 'true'
        run: |
          for f in extensions/paperterminal/bin/*.sh; do sh -n "$f"; done
          python3 -c "import json; json.load(open('extensions/paperterminal/menu.json'))"
          python3 -c "import xml.dom.minidom as m; m.parse('extensions/paperterminal/config.xml')"

      - name: Build release zip
        if: steps.meta.outputs.proceed == 'true'
        run: |
          mkdir -p dist/extensions
          cp -r extensions/paperterminal dist/extensions/
          cd dist
          zip -q -r -X "paperterminal-${{ steps.meta.outputs.version }}.zip" extensions
          sha256sum "paperterminal-${{ steps.meta.outputs.version }}.zip" > \
            "paperterminal-${{ steps.meta.outputs.version }}.zip.sha256"
          unzip -l "paperterminal-${{ steps.meta.outputs.version }}.zip" | tail -3

      - name: Write release notes
        if: steps.meta.outputs.proceed == 'true'
        run: |
          V="${{ steps.meta.outputs.version }}"
          cat > notes.md <<EOF
          # PaperTerminal $V

          Airport arrival/departure board for the jailbroken Kindle 3
          Keyboard (KUAL extension). Works out of the box with free,
          keyless ADS-B data; optional API keys add true schedules and
          runway data. Bundled static curl/OpenSSL - no proxy needed.

          ## Install

          1. Download \`paperterminal-$V.zip\` below.
          2. Plug the Kindle in over USB and unzip the archive onto the
             Kindle's USB drive root - it contains
             \`extensions/paperterminal/...\` and merges into any existing
             \`extensions\` folder.
          3. Eject, open KUAL, pick **PaperTerminal Flight Board** - it
             works immediately, no API key needed. Run the network
             self-test first to check each layer.

          Requires a jailbroken Kindle 3 with the KUAL kindlet installed -
          see the README for details, including optional API keys for
          schedule data.
          EOF

      - name: Create release or refresh its assets
        if: steps.meta.outputs.proceed == 'true'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/paperterminal-*.zip* --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/paperterminal-*.zip* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PaperTerminal ${{ steps.meta.outputs.version }}" \
              --notes-file notes.md
          fi
